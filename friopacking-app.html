<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friopacking · Tablero de Planes Estratégicos</title>
</head>
<body>
<style>
/* =============================================================================
   FRIOPACKING · Design Tokens
   Centraliza toda la identidad visual. Modifica aquí para re-brandear.
   Paleta real extraída de dashboard_inicial.html (grupo Friopacking) +
   paleta premium de cadena de frío indicada en el brief.
   ============================================================================= */
:root {
  /* --- Marca principal (azul corporativo Friopacking) --- */
  --brand-900: #0B1F33;   /* azul marino profundo */
  --brand-800: #003D7A;   /* navy corporativo (real) */
  --brand-700: #0059B3;
  --brand-600: #0072CE;   /* azul Friopacking (real) */
  --brand-500: #1677FF;   /* azul tecnológico */
  --brand-400: #4DA8DA;
  --brand-300: #86C5E8;
  --brand-200: #BFDDF7;
  --brand-100: #EAF7FF;   /* celeste hielo */
  --brand-50:  #F4F9FD;

  /* --- Acento cian (cadena de frío) --- */
  --accent-cyan: #23C7D9;
  --accent-cyan-dark: #0EA5B7;

  /* --- Acento cálido (marca FRIOPACKING naranja, real) --- */
  --accent-orange: #F26522;

  /* --- Neutros --- */
  --ink-900: #0F1B27;
  --ink-800: #18222D;   /* grafito */
  --ink-700: #2B3946;
  --ink-600: #475569;
  --ink-500: #64748B;
  --ink-400: #94A3B8;
  --ink-300: #CBD5E1;
  --ink-200: #E2E8F0;
  --ink-100: #EEF2F6;
  --ink-50:  #F8FBFD;   /* blanco frío */
  --white:   #FFFFFF;

  /* --- Semáforo ejecutivo / estados --- */
  --ok:        #16A36A;   /* verde de cumplimiento */
  --ok-bg:     #E6F6EF;
  --warn:      #F5A623;   /* ámbar de alerta */
  --warn-bg:   #FEF4E2;
  --danger:    #D64545;   /* rojo de desviación */
  --danger-bg: #FBE9E9;
  --info:      #0072CE;
  --info-bg:   #EAF7FF;
  --neutral:   #64748B;
  --neutral-bg:#EEF2F6;

  /* --- Superficies --- */
  --bg-app: #F1F5F9;
  --bg-surface: #FFFFFF;
  --bg-surface-2: #F8FBFD;
  --bg-sidebar: #0B1F33;
  --bg-sidebar-2: #0E2740;

  /* --- Bordes --- */
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --border-brand: #BFDDF7;

  /* --- Texto --- */
  --text-strong: #0F1B27;
  --text: #2B3946;
  --text-muted: #64748B;
  --text-faint: #94A3B8;
  --text-on-brand: #FFFFFF;

  /* --- Tipografía --- */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-base: 0.925rem;
  --fs-md: 1.02rem;
  --fs-lg: 1.2rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 1.95rem;
  --fs-3xl: 2.6rem;

  --lh-tight: 1.15;
  --lh-normal: 1.5;

  /* --- Radios --- */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-full: 999px;

  /* --- Sombras (discretas, ejecutivas) --- */
  --sh-xs: 0 1px 2px rgba(11,31,51,0.06);
  --sh-sm: 0 1px 3px rgba(11,31,51,0.08), 0 1px 2px rgba(11,31,51,0.04);
  --sh-md: 0 4px 14px rgba(11,31,51,0.08), 0 2px 6px rgba(11,31,51,0.04);
  --sh-lg: 0 12px 34px rgba(11,31,51,0.12), 0 4px 12px rgba(11,31,51,0.06);
  --sh-brand: 0 10px 30px rgba(0,114,206,0.20);

  /* --- Gradientes controlados --- */
  --grad-brand: linear-gradient(135deg, #003D7A 0%, #0072CE 55%, #23C7D9 130%);
  --grad-brand-soft: linear-gradient(135deg, #EAF7FF 0%, #F8FBFD 100%);
  --grad-ice: linear-gradient(135deg, #0B1F33 0%, #12395F 60%, #0072CE 130%);
  --grad-sidebar: linear-gradient(180deg, #0B1F33 0%, #0E2740 100%);

  /* --- Layout --- */
  --sidebar-w: 260px;
  --header-h: 66px;
  --content-max: 1360px;

  /* --- Transiciones --- */
  --t-fast: 120ms cubic-bezier(0.4,0,0.2,1);
  --t: 200ms cubic-bezier(0.4,0,0.2,1);
  --t-slow: 320ms cubic-bezier(0.4,0,0.2,1);
}


/* =============================================================================
   FRIOPACKING · Base / Reset / Layout shell
   ============================================================================= */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  color: var(--text);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--brand-400); outline-offset: 2px; border-radius: 4px; }

h1,h2,h3,h4 { color: var(--text-strong); line-height: var(--lh-tight); font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-2xl); }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { color: var(--text); }
small { font-size: var(--fs-xs); }

.skip-link {
  position: absolute; left: -999px; top: 0; z-index: 200;
  background: var(--brand-600); color: #fff; padding: 10px 16px; border-radius: 0 0 8px 0;
}
.skip-link:focus { left: 0; }

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--grad-sidebar); color: #cfe3f5;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.06);
  z-index: 60;
}
.sidebar__brand { padding: 18px 18px 14px; display: flex; align-items: center; gap: 12px; }
.sidebar__brand .brand-mark { flex: 0 0 auto; }
.sidebar__brand-text { line-height: 1.05; }
.sidebar__brand-text b { color: #fff; font-size: 1.06rem; letter-spacing: 0.2px; display:block; }
.sidebar__brand-text span { color: #7fb2e0; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.4px; }

.sidebar__section-label {
  color: #5f89b3; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 1.3px;
  padding: 16px 20px 6px; font-weight: 700;
}
.nav { display: flex; flex-direction: column; padding: 4px 12px; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
  color: #b6cfe6; font-size: 0.88rem; font-weight: 500; transition: background var(--t-fast), color var(--t-fast);
  text-decoration: none;
}
.nav a .ico { flex: 0 0 18px; opacity: 0.9; }
.nav a:hover { background: rgba(255,255,255,0.06); color: #fff; text-decoration: none; }
.nav a.active { background: linear-gradient(90deg, rgba(0,114,206,0.35), rgba(35,199,217,0.12)); color: #fff; box-shadow: inset 3px 0 0 var(--accent-cyan); }
.nav a .badge { margin-left: auto; }

.sidebar__foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.72rem; color: #6f97c0; }

/* ---------- Main ---------- */
.main { flex: 1 1 auto; min-width: 0; max-width: 100%; display: flex; flex-direction: column; overflow-x: hidden; }

.topbar {
  height: var(--header-h); background: rgba(255,255,255,0.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px; padding: 0 22px;
}
.topbar__title { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; overflow: hidden; }
.topbar__title b { font-size: 0.98rem; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar__title span { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar__spacer { flex: 1 1 auto; }
.topbar__hamburger { display: none; }

.content { padding: 26px 26px 60px; max-width: var(--content-max); width: 100%; margin: 0 auto; }
.content--wide { max-width: 1600px; }

.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head__text { min-width: 0; }
.page-head h1 { margin-bottom: 4px; }
.page-head .subtitle { color: var(--text-muted); font-size: 0.94rem; }
.page-head__actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

.mobile-overlay { display: none; }

/* ---------- Grids ---------- */
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-6 { grid-template-columns: repeat(6, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .grid-6 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1024px) {
  :root { --sidebar-w: 240px; }
  .sidebar {
    position: fixed; left: 0; top: 0; transform: translateX(-100%);
    transition: transform var(--t); box-shadow: var(--sh-lg);
  }
  body.nav-open .sidebar { transform: translateX(0); }
  body.nav-open .mobile-overlay { display: block; position: fixed; inset: 0; background: rgba(11,31,51,0.45); z-index: 55; }
  .topbar__hamburger { display: inline-flex; }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .content { padding: 16px 14px 60px; }
  .grid-2, .grid-3, .grid-4, .grid-6 { grid-template-columns: 1fr; }
  .page-head__actions { margin-left: 0; width: 100%; }
  .page-head__actions .btn { flex: 1; }
  h1 { font-size: 1.5rem; }
  .topbar { padding: 0 14px; gap: 10px; }
  .topbar__title span { display: none; }
  .role-select select { max-width: 130px; }
}

/* ---------- Print ---------- */
@media print {
  .sidebar, .topbar, .no-print, .page-head__actions { display: none !important; }
  body { background: #fff; }
  .content { max-width: 100%; padding: 0; }
  .card, .panel { box-shadow: none !important; border: 1px solid #ccc; break-inside: avoid; }
}


/* =============================================================================
   FRIOPACKING · Components
   ============================================================================= */

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 15px; border-radius: 10px; border: 1px solid transparent;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast), border-color var(--t-fast);
  background: var(--white); color: var(--text-strong); border-color: var(--border-strong);
}
.btn:hover { box-shadow: var(--sh-sm); transform: translateY(-1px); text-decoration: none; }
.btn:active { transform: translateY(0); }
.btn .ico { flex: 0 0 auto; }
.btn--primary { background: var(--grad-brand); color: #fff; border-color: transparent; box-shadow: var(--sh-brand); }
.btn--primary:hover { box-shadow: 0 12px 34px rgba(0,114,206,0.32); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text); }
.btn--ghost:hover { background: var(--ink-100); }
.btn--wa { background: #25D366; color: #06331b; border-color: transparent; }
.btn--wa:hover { background: #1fbe5b; }
.btn--sm { padding: 6px 11px; font-size: 0.78rem; border-radius: 8px; }
.btn--icon { padding: 8px; width: 36px; height: 36px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Cards / panels ---------- */
.card, .panel {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
}
.panel { padding: 20px; }
.panel--pad-lg { padding: 26px; }
.panel__head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.panel__head h3 { font-size: 1.02rem; }
.panel__head .panel__sub { font-size: 0.76rem; color: var(--text-muted); }
.panel__head .btn { margin-left: auto; }
.panel__actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ---------- Stat / KPI cards ---------- */
.stat {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 16px 18px; box-shadow: var(--sh-sm); position: relative; overflow: hidden;
  transition: box-shadow var(--t), transform var(--t);
}
.stat:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
.stat::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: var(--brand-500); }
.stat.ok::before { background: var(--ok); }
.stat.warn::before { background: var(--warn); }
.stat.danger::before { background: var(--danger); }
.stat__label { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; display:flex; align-items:center; gap:6px; }
.stat__value { font-size: 1.85rem; font-weight: 800; color: var(--text-strong); line-height: 1.05; margin-top: 6px; letter-spacing: -0.02em; }
.stat__value small { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }
.stat__foot { margin-top: 8px; font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.stat__delta { font-weight: 700; }
.stat__delta.up { color: var(--ok); }
.stat__delta.down { color: var(--danger); }

.kpi-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 15px 16px; box-shadow: var(--sh-xs);
}
.kpi-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.kpi-card__name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.kpi-card__val { font-size: 1.5rem; font-weight: 800; color: var(--text-strong); margin: 8px 0 2px; }
.kpi-card__meta { display: flex; justify-content: space-between; font-size: 0.73rem; color: var(--text-muted); }

/* ---------- Badges / semáforo ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--r-full);
  font-size: 0.72rem; font-weight: 700; line-height: 1.6; white-space: nowrap;
  background: var(--neutral-bg); color: var(--neutral);
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-bg); color: #0c7a4d; }
.badge.warn { background: var(--warn-bg); color: #a9660a; }
.badge.danger { background: var(--danger-bg); color: #b02929; }
.badge.info { background: var(--info-bg); color: #0059B3; }
.badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
.badge.purple { background: #F1EBFE; color: #6D28D9; }
.badge--lg { font-size: 0.8rem; padding: 4px 12px; }
.badge--outline { background: transparent; border: 1px solid currentColor; }

.tl { display: inline-flex; align-items: center; gap: 7px; font-size: 0.78rem; font-weight: 600; }
.tl .light { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
.tl.ok .light { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.tl.warn .light { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.tl.danger .light { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-bg); }

/* ---------- Progress ---------- */
.progress { height: 8px; border-radius: var(--r-full); background: var(--ink-100); overflow: hidden; }
.progress__bar { height: 100%; border-radius: var(--r-full); background: var(--grad-brand); transition: width var(--t-slow); }
.progress__bar.ok { background: linear-gradient(90deg,#16A36A,#42c78d); }
.progress__bar.warn { background: linear-gradient(90deg,#F5A623,#f7bd57); }
.progress__bar.danger { background: linear-gradient(90deg,#D64545,#e57373); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--white); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 640px; }
table.tbl th, table.tbl td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
table.tbl thead th {
  background: var(--bg-surface-2); color: var(--text-muted); font-weight: 700; font-size: 0.7rem;
  text-transform: uppercase; letter-spacing: 0.4px; position: sticky; top: 0; z-index: 1; white-space: nowrap;
}
table.tbl tbody tr:hover { background: var(--brand-50); }
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl td.strong { font-weight: 700; color: var(--text-strong); }
.cell-kpi { font-weight: 600; color: var(--text-strong); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 10px 15px; border: none; background: none; cursor: pointer; font-size: 0.85rem; font-weight: 600;
  color: var(--text-muted); border-bottom: 2.5px solid transparent; white-space: nowrap; transition: color var(--t-fast);
}
.tab:hover { color: var(--brand-600); }
.tab.active { color: var(--brand-700); border-bottom-color: var(--brand-600); }
.tabpanel { padding-top: 20px; }
.tabpanel[hidden] { display: none; }

/* ---------- Chips / filters ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 5px 12px; border-radius: var(--r-full); border: 1px solid var(--border-strong);
  background: var(--white); font-size: 0.76rem; font-weight: 600; color: var(--text-muted); cursor: pointer;
  transition: all var(--t-fast);
}
.chip:hover { border-color: var(--brand-400); color: var(--brand-600); }
.chip.active { background: var(--brand-600); color: #fff; border-color: var(--brand-600); }

/* ---------- Plan card ---------- */
.plan-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-xl);
  box-shadow: var(--sh-sm); overflow: hidden; display: flex; flex-direction: column;
  transition: box-shadow var(--t), transform var(--t); position: relative;
}
.plan-card:hover { box-shadow: var(--sh-lg); transform: translateY(-3px); }
.plan-card__banner { height: 92px; position: relative; padding: 16px 18px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
.plan-card__banner .pc-icon { position: absolute; right: 14px; top: 14px; opacity: 0.35; }
.plan-card__no { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; opacity: 0.85; text-transform: uppercase; }
.plan-card__title { font-size: 1.12rem; font-weight: 800; line-height: 1.15; }
.plan-card__body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.plan-card__desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }
.plan-card__meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; font-size: 0.78rem; }
.plan-card__meta .k { color: var(--text-faint); display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; }
.plan-card__meta .v { color: var(--text-strong); font-weight: 600; }
.plan-card__stats { display: flex; gap: 8px; }
.plan-card__stat { flex: 1; background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; text-align: center; }
.plan-card__stat b { display: block; font-size: 1.15rem; color: var(--text-strong); }
.plan-card__stat span { font-size: 0.64rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
.plan-card__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 18px 18px; }
.plan-card__actions .btn { width: 100%; }
.plan-card__actions .btn--primary { grid-column: 1 / -1; }

/* ---------- Progress ring ---------- */
.ring { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring__label { position: absolute; text-align: center; }
.ring__label b { font-size: 1.2rem; font-weight: 800; color: var(--text-strong); }
.ring__label span { display:block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* ---------- Timeline / phases ---------- */
.phase-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; }
.phase {
  padding: 16px; border-top: 4px solid var(--brand-300); background: var(--bg-surface-2);
  border-right: 1px solid var(--border);
}
.phase:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
.phase:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; border-right: none; }
.phase.done { border-top-color: var(--ok); }
.phase.active { border-top-color: var(--brand-600); background: var(--brand-50); }
.phase__no { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }
.phase__name { font-size: 1.02rem; font-weight: 800; color: var(--text-strong); margin: 2px 0 3px; }

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** Formatea número con separador de miles es-PE. */
function num(n, dec = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number(n).toLocaleString('es-PE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

/** Formato moneda USD compacto. */
function usd(n) {
  if (!n && n !== 0) return '—';
  if (Math.abs(n) >= 1000) return 'USD ' + (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
  return 'USD ' + num(n);
}

/** Query helpers. */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** Delegación de eventos: on(root, 'click', '[data-x]', handler). */
function on(root, type, selector, handler) {
  root.addEventListener(type, (e) => {
    const target = e.target.closest(selector);
    if (target && root.contains(target)) handler(e, target);
  });
}

function semaforoFromKpi(kpi) {
  if (kpi.semaforo) return kpi.semaforo;
  const higherBetter = !['días', 'horas', 'u', 'pp'].includes(kpi.unidad) || kpi.tendencia === 'up';

function fecha(iso) {

/**
 * Gráficos ejecutivos en SVG puro (sin librerías). Devuelven strings SVG.
 * Paleta consistente con los design tokens.
 */

const PALETTE = ['#0072CE', '#23C7D9', '#16A36A', '#F5A623', '#8B5CF6', '#D64545', '#0EA5B7', '#475569'];
const SEM_CH = { ok: '#16A36A', warn: '#F5A623', danger: '#D64545', info: '#0072CE', neutral: '#64748B' };
const semColor = (s) => SEM_CH[s] || '#0072CE';

/** Anillo de progreso. value 0..100 */
function progressRing(value, { size = 120, stroke = 12, color = '#0072CE', label = '', sub = '' } = {}) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, value)) / 100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#EEF2F6" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>
    <div class="ring__label"><b>${value}%</b>${sub ? `<span>${esc(sub)}</span>` : (label ? `<span>${esc(label)}</span>` : '')}</div>
  </div>`;
}

/** Donut chart. data: [{label, value, color?}] */
function donut(data, { size = 160, thickness = 26, centerLabel = '', centerSub = '' } = {}) {
  const total = data.reduce((a, d) => a + d.value, 0) || 1;
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  let acc = 0;
  const segs = data.map((d, i) => {
    const frac = d.value / total;
    const a0 = acc * 2 * Math.PI - Math.PI / 2;
    acc += frac;
    const a1 = acc * 2 * Math.PI - Math.PI / 2;
    const large = frac > 0.5 ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const col = d.color || PALETTE[i % PALETTE.length];
    if (frac >= 0.999) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${thickness}"/>`;
    }
    return `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"
      fill="none" stroke="${col}" stroke-width="${thickness}"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">
    ${segs}
    ${centerLabel ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="22" font-weight="800" fill="#0F1B27">${esc(centerLabel)}</text>` : ''}
    ${centerSub ? `<text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10" fill="#64748B">${esc(centerSub)}</text>` : ''}
  </svg>`;
}

/** Barras verticales. data: [{label, value, color?}] */
function barChart(data, { width = 460, height = 220, color = '#0072CE', suffix = '', pad = 34 } = {}) {
  const max = Math.max(...data.map((d) => d.value), 1);
  const bw = (width - pad * 2) / data.length;
  const chartH = height - pad - 22;
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const y = pad + chartH * (1 - f);
    return `<line class="grid-line" x1="${pad}" y1="${y}" x2="${width - 6}" y2="${y}"/>
      <text x="${pad - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#94A3B8">${num(Math.round(max * f))}</text>`;
  }).join('');
  const bars = data.map((d, i) => {
    const h = (d.value / max) * chartH;
    const x = pad + i * bw + bw * 0.18;
    const w = bw * 0.64;
    const y = pad + chartH - h;
    const col = d.color || color;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="4" fill="${col}"/>
      <text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B3946">${num(d.value)}${suffix}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${height - 6}" text-anchor="middle" font-size="9" fill="#64748B">${esc(d.label)}</text>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" role="img" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}

/** Barras horizontales. data: [{label, value, color?}] */
function hBarChart(data, { width = 460, rowH = 30, suffix = '', color = '#0072CE', labelW = 120 } = {}) {
  const max = Math.max(...data.map((d) => d.value), 1);
  const height = data.length * rowH + 10;
  const trackW = width - labelW - 54;
  const rows = data.map((d, i) => {
    const y = 6 + i * rowH;
    const w = (d.value / max) * trackW;
    const col = d.color || color;
    return `<text x="0" y="${y + rowH / 2 + 1}" font-size="10.5" fill="#2B3946" dominant-baseline="middle">${esc(d.label)}</text>
      <rect x="${labelW}" y="${y + 4}" width="${trackW}" height="${rowH - 12}" rx="5" fill="#EEF2F6"/>
      <rect x="${labelW}" y="${y + 4}" width="${Math.max(w, 2).toFixed(1)}" height="${rowH - 12}" rx="5" fill="${col}"/>
      <text x="${(labelW + Math.max(w, 2) + 6).toFixed(1)}" y="${y + rowH / 2 + 1}" font-size="10" font-weight="700" fill="#2B3946" dominant-baseline="middle">${num(d.value)}${suffix}</text>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" role="img" preserveAspectRatio="xMidYMid meet">${rows}</svg>`;
}

/** Línea (evolución). series: [{label,color,points:[y...]}] labels: [x...] */
function lineChart(series, labels, { width = 480, height = 220, pad = 34, suffix = '', maxHint } = {}) {
  const allVals = series.flatMap((s) => s.points);
  const max = maxHint || Math.max(...allVals, 1);
  const min = Math.min(...allVals, 0);
  const chartH = height - pad - 20;
  const chartW = width - pad - 12;
  const xFor = (i) => pad + (chartW * i) / Math.max(labels.length - 1, 1);
  const yFor = (v) => pad + chartH * (1 - (v - min) / (max - min || 1));
  const grid = [0, 0.5, 1].map((f) => {
    const y = pad + chartH * (1 - f);
    return `<line class="grid-line" x1="${pad}" y1="${y}" x2="${width - 6}" y2="${y}"/>
      <text x="${pad - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#94A3B8">${num(Math.round(min + (max - min) * f))}</text>`;
  }).join('');
  const xlabels = labels.map((l, i) => `<text x="${xFor(i)}" y="${height - 5}" text-anchor="middle" font-size="9" fill="#64748B">${esc(l)}</text>`).join('');
  const lines = series.map((s) => {
    const pts = s.points.map((v, i) => `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    const dots = s.points.map((v, i) => `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    const area = `${xFor(0).toFixed(1)},${(pad + chartH).toFixed(1)} ${pts} ${xFor(s.points.length - 1).toFixed(1)},${(pad + chartH).toFixed(1)}`;
    return `<polygon points="${area}" fill="${s.color}" opacity="0.07"/>
      <polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" role="img" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xlabels}</svg>`;
}

/** Leyenda para charts. items: [{label,color}] */
function legend(items) {
  return `<div class="chart-legend">${items.map((it) => `<span><i style="background:${it.color}"></i>${esc(it.label)}</span>`).join('')}</div>`;
}

/** Normaliza teléfono a formato internacional sin símbolos (código país + número). */
function normalizePhone(raw, defaultCountry = '51') {
  let d = String(raw || '').replace(/[^\d]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  // Si parece número local peruano (9 dígitos) anteponer código país.
  if (d.length === 9 && defaultCountry) d = defaultCountry + d;
  return d;
}

/** URL oficial wa.me con mensaje codificado. */
function waLink(message, phone = '') {
  const base = phone ? `https://wa.me/${phone}` : 'https://wa.me/';
  return `${base}?text=${encodeURIComponent(message)}`;
}

/** Intenta Web Share API; devuelve true si se usó. */
async function tryWebShare({ title, text, url }) {
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return true; return false; }
  }
  return false;
}

/** Nivel 2: envío vía backend (WhatsApp Business Cloud API). */
async function sendViaBackend(phone, message) {
  const res = await fetch('/api/whatsapp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to: phone, message }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}


/* ===== src/lib/export.js ===== */
/**
 * Exportación sin dependencias externas.
 *  - svgToPng: rasteriza un <svg> a PNG de alta resolución vía canvas.
 *  - downloadDataUrl / downloadText: descargas de archivos.
 *  - printElement: imprime un nodo en ventana aislada (PDF vía "Guardar como PDF").
 * Todo se ejecuta en el navegador del usuario, offline.
 */

/** Serializa un elemento SVG a string con dimensiones explícitas. */
function serializeSvg(svgEl, width, height) {
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', width);
  clone.setAttribute('height', height);
  return new XMLSerializer().serializeToString(clone);
}

/** Rasteriza un SVG (elemento o string) a PNG dataURL. scale para alta resolución. */
function svgToPng(svg, { width, height, scale = 2, background = '#ffffff' } = {}) {
  return new Promise((resolve, reject) => {
    let str, w = width, h = height;
    if (typeof svg === 'string') {
      str = svg;
      if (!w || !h) {
        const vb = /viewBox=["']([\d.\s]+)["']/.exec(svg);
        if (vb) { const p = vb[1].trim().split(/\s+/).map(Number); w = w || p[2]; h = h || p[3]; }
      }
    } else {
      w = w || svg.viewBox.baseVal.width || svg.clientWidth;
      h = h || svg.viewBox.baseVal.height || svg.clientHeight;
      str = serializeSvg(svg, w, h);
    }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext('2d');
    const img = new Image();
    const blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      if (background) { ctx.fillStyle = background; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      try { resolve(canvas.toDataURL('image/png')); }
      catch (e) { reject(e); }
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(new Error('No se pudo rasterizar el SVG')); };
    img.src = url;
  });
}

/** Descarga un dataURL como archivo. */
function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/** Descarga texto/HTML como archivo. */
function downloadText(text, filename, type = 'text/plain') {
  const blob = new Blob([text], { type: `${type};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  downloadDataUrl(url, filename);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/** Descarga un SVG (string) como archivo .svg. */
function downloadSvg(svgString, filename) {
  downloadText(svgString, filename, 'image/svg+xml');
}

/**
 * Imprime HTML en una ventana aislada con estilos de reporte.
 * El usuario elige "Guardar como PDF" en el diálogo de impresión.
 */
function printHtml(innerHtml, title = 'Reporte Friopacking', styles = '') {
  const win = window.open('', '_blank', 'width=900,height=1200');
  if (!win) { alert('Habilita las ventanas emergentes para generar el PDF.'); return; }
  win.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8">
    <title>${title}</title><style>${styles}</style></head><body>${innerHtml}</body></html>`);
  win.document.close();
  win.focus();
  // Espera al render antes de imprimir.
  setTimeout(() => { win.print(); }, 400);
}


/* ===== src/lib/router.js ===== */
/**
 * Router hash minimalista. Rutas:
 *  #/                       overview
 *  #/planes                 lista de planes
 *  #/plan/:id               detalle (con ?tab=)
 *  #/plan/:id/infografia    infografía
 *  #/plan/:id/reporte       reporte
 *  #/reportes               centro de reportes
 *  #/bitacora               actividad
 *  #/roles                  roles y permisos
 */
const routes = [];
let notFound = () => {};

function route(pattern, handler) { routes.push({ pattern, handler }); }
function setNotFound(fn) { notFound = fn; }

function parse(hash) {
  const [path, query = ''] = hash.replace(/^#/, '').split('?');
  const clean = path.replace(/^\/+|\/+$/g, '');
  const parts = clean === '' ? [] : clean.split('/');
  const params = Object.fromEntries(new URLSearchParams(query));
  return { parts, params, path: '/' + clean };
}

function match(pattern, parts) {
  const pp = pattern.replace(/^\/+|\/+$/g, '');
  const segs = pp === '' ? [] : pp.split('/');
  if (segs.length !== parts.length) return null;
  const out = {};
  for (let i = 0; i < segs.length; i++) {
    if (segs[i].startsWith(':')) out[segs[i].slice(1)] = decodeURIComponent(parts[i]);
    else if (segs[i] !== parts[i]) return null;
  }
  return out;
}

function resolve() {
  const { parts, params, path } = parse(location.hash || '#/');
  for (const r of routes) {
    const m = match(r.pattern, parts);
    if (m) { r.handler({ ...m, query: params, path }); return; }
  }
  notFound({ path });
}

function navigate(to) { location.hash = to.startsWith('#') ? to : '#' + to; }

function startRouter() {
  window.addEventListener('hashchange', () => { resolve(); window.scrollTo(0, 0); });
  resolve();
}

  const close = () => { backdrop.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop || e.target.closest('[data-close]')) close(); });

/** Divide texto en líneas por longitud aproximada de caracteres. */
function wrap(text, maxChars) {
  const words = String(text).split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > maxChars) { if (cur) lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

function tspans(text, x, y, maxChars, lh, attrs = '') {
  return wrap(text, maxChars).map((l, i) => `<text x="${x}" y="${y + i * lh}" ${attrs}>${esc(l)}</text>`).join('');
}

/** Logo copo de nieve para infografía. */
function logo(x, y, s = 46) {
  return `<g transform="translate(${x},${y})">
    <rect width="${s}" height="${s}" rx="13" fill="url(#igbrand)"/>
    <g stroke="#EAF7FF" stroke-width="2.4" stroke-linecap="round" transform="translate(${s / 2},${s / 2})">
      <line x1="0" y1="-${s * 0.34}" x2="0" y2="${s * 0.34}"/>
      <line x1="-${s * 0.3}" y1="-${s * 0.17}" x2="${s * 0.3}" y2="${s * 0.17}"/>
      <line x1="-${s * 0.3}" y1="${s * 0.17}" x2="${s * 0.3}" y2="-${s * 0.17}"/>
    </g>
    <circle cx="${s / 2}" cy="${s / 2}" r="4" fill="#fff"/>
  </g>`;
}

function defs() {
  return `<defs>
    <linearGradient id="igbrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${C.blueDark}"/><stop offset="0.6" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.cyan}"/>
    </linearGradient>
    <linearGradient id="ighead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${C.navy}"/><stop offset="0.55" stop-color="#12395F"/><stop offset="1" stop-color="${C.blue}"/>
    </linearGradient>
  </defs>`;
}

function metricTile(x, y, w, h, kpi) {
  const sem = semaforoFromKpi(kpi);
  const col = SEM[sem];
  const val = num(kpi.actual, kpi.unidad === '%' || Number.isInteger(kpi.actual) ? 0 : 1);
  return `<g transform="translate(${x},${y})">
    <rect width="${w}" height="${h}" rx="14" fill="#fff" stroke="${C.line}"/>
    <rect width="6" height="${h}" rx="3" fill="${col}"/>
    ${tspans(kpi.kpi, 20, 34, Math.floor(w / 8.6), 19, `font-size="14" font-weight="600" fill="${C.ink}"`)}
    <text x="20" y="${h - 34}" font-size="34" font-weight="800" fill="${C.ink}">${val}<tspan font-size="15" fill="${C.muted}"> ${esc(kpi.unidad)}</tspan></text>
    <text x="20" y="${h - 13}" font-size="12" fill="${C.muted}">Meta ${num(kpi.meta)} ${esc(kpi.unidad)}</text>
    <circle cx="${w - 22}" cy="26" r="7" fill="${col}"/>
  </g>`;
}

function flowChips(nodes, x, y, w, maxPerRow = 4) {
  const gap = 10;
  const cw = (w - gap * (maxPerRow - 1)) / maxPerRow;
  const ch = 44;
  return nodes.map((n, i) => {
    const col = i % maxPerRow, row = Math.floor(i / maxPerRow);
    const cx = x + col * (cw + gap), cy = y + row * (ch + gap);
    return `<g transform="translate(${cx},${cy})">
      <rect width="${cw}" height="${ch}" rx="10" fill="${C.ice}" stroke="${C.blue}" stroke-opacity="0.25"/>
      <text x="12" y="19" font-size="10" font-weight="700" fill="${C.blue}">${esc(n.step)}</text>
      ${tspans(n.nombre, 12, 33, Math.floor(cw / 6.5), 12, `font-size="11" font-weight="600" fill="${C.ink}"`)}
    </g>`;
  }).join('');
}

/** Genera la infografía vertical (1080×1920). */
function vertical(plan) {
  const W = 1080, H = 1920, pad = 60;
  const kpis = plan.kpis.slice(0, 6);
  const critica = plan.desviaciones.filter((d) => ['Alta', 'Crítica'].includes(d.severidad));
  const acciones = plan.planAccion.slice(0, 4);
  let y = 0;
  const head = `
    <rect width="${W}" height="360" fill="url(#ighead)"/>
    ${logo(pad, 56, 64)}
    <text x="${pad + 82}" y="88" font-size="26" font-weight="800" fill="#fff">FRIOPACKING</text>
    <text x="${pad + 82}" y="116" font-size="15" fill="#9EC5E8" letter-spacing="2">PLAN ESTRATÉGICO · 90 DÍAS</text>
    <text x="${pad}" y="196" font-size="17" fill="${C.cyan}" font-weight="700">PLAN ${esc(plan.numero)}</text>
    ${tspans(plan.nombre, pad, 240, 30, 46, `font-size="40" font-weight="800" fill="#fff"`)}
    <rect x="${pad}" y="286" width="${W - pad * 2}" height="54" rx="12" fill="rgba(255,255,255,0.12)"/>
    <text x="${pad + 18}" y="320" font-size="17" fill="#EAF7FF">Avance</text>
    <text x="${pad + 110}" y="320" font-size="19" font-weight="800" fill="#fff">${plan.avance}%</text>
    <text x="${pad + 210}" y="320" font-size="17" fill="#EAF7FF">Riesgo ${esc(plan.nivelRiesgo)}</text>
    <text x="${W - pad - 18}" y="320" text-anchor="end" font-size="17" fill="#EAF7FF">${esc(plan.estado)}</text>
  `;
  y = 410;
  const obj = `<text x="${pad}" y="${y}" font-size="18" font-weight="800" fill="${C.blue}">OBJETIVO (90 DÍAS)</text>
    ${tspans(plan.objetivo90, pad, y + 30, 66, 26, `font-size="18" fill="${C.ink}"`)}`;
  y += 30 + wrap(plan.objetivo90, 66).length * 26 + 34;

  const kY = y + 34;
  const kpiTitle = `<text x="${pad}" y="${y}" font-size="18" font-weight="800" fill="${C.blue}">INDICADORES PRINCIPALES</text>`;
  const tileW = (W - pad * 2 - 20) / 2, tileH = 104;
  const tiles = kpis.map((k, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    return metricTile(pad + col * (tileW + 20), kY + row * (tileH + 16), tileW, tileH, k);
  }).join('');
  y = kY + Math.ceil(kpis.length / 2) * (tileH + 16) + 24;

  const flowTitle = `<text x="${pad}" y="${y}" font-size="18" font-weight="800" fill="${C.blue}">FLUJO OPERATIVO</text>`;
  const flow = flowChips(plan.flujo, pad, y + 16, W - pad * 2, 4);
  y = y + 16 + Math.ceil(plan.flujo.length / 4) * 54 + 30;

  const devBox = `
    <text x="${pad}" y="${y}" font-size="18" font-weight="800" fill="${C.blue}">DESVIACIONES CRÍTICAS</text>
    <g transform="translate(${pad},${y + 16})">
      <rect width="${(W - pad * 2 - 20) / 2}" height="88" rx="14" fill="${critica.length ? '#FBE9E9' : '#E6F6EF'}"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="${critica.length ? C.danger : C.ok}">${critica.length}</text>
      <text x="90" y="40" font-size="14" fill="${C.ink}">de severidad</text>
      <text x="90" y="60" font-size="14" fill="${C.ink}">Alta / Crítica</text>
    </g>
    <g transform="translate(${pad + (W - pad * 2 - 20) / 2 + 20},${y + 16})">
      <rect width="${(W - pad * 2 - 20) / 2}" height="88" rx="14" fill="${C.soft}" stroke="${C.line}"/>
      <text x="24" y="52" font-size="46" font-weight="800" fill="${C.blue}">${plan.hitosCumplidos}/${plan.hitosTotal}</text>
      <text x="150" y="40" font-size="14" fill="${C.ink}">hitos</text>
      <text x="150" y="60" font-size="14" fill="${C.ink}">cumplidos</text>
    </g>`;
  y += 16 + 88 + 30;

  const actTitle = `<text x="${pad}" y="${y}" font-size="18" font-weight="800" fill="${C.blue}">ACCIONES PRIORITARIAS</text>`;
  const acts = acciones.map((a, i) => {
    const ay = y + 18 + i * 58;
    return `<g transform="translate(${pad},${ay})">
      <rect width="${W - pad * 2}" height="48" rx="10" fill="#fff" stroke="${C.line}"/>
      <rect width="5" height="48" rx="2.5" fill="${C.blue}"/>
      ${tspans(a.iniciativa, 20, 22, 60, 15, `font-size="15" font-weight="700" fill="${C.ink}"`)}
      <text x="20" y="40" font-size="12" fill="${C.muted}">${esc(a.responsable)} · ${esc(a.estado)} · ${a.progreso}%</text>
      <text x="${W - pad * 2 - 16}" y="30" text-anchor="end" font-size="13" font-weight="700" fill="${C.blue}">${esc(a.prioridad)}</text>
    </g>`;
  }).join('');
  y += 18 + acciones.length * 58 + 20;

  const foot = `
    <line x1="${pad}" y1="${H - 128}" x2="${W - pad}" y2="${H - 128}" stroke="${C.line}"/>
    <text x="${pad}" y="${H - 92}" font-size="15" fill="${C.muted}">Próximo hito</text>
    ${tspans(plan.proximoHito, pad, H - 66, 74, 22, `font-size="16" font-weight="600" fill="${C.ink}"`)}
    <text x="${pad}" y="${H - 28}" font-size="13" fill="${C.muted}">Actualizado: ${esc(plan.fechaActualizacion)} · Fuente: Plan Estratégico 90 días · Benchmark: ${esc(plan.benchmark.practicas)}</text>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Inter, Arial, sans-serif">
    ${defs()}<rect width="${W}" height="${H}" fill="${C.white}"/>
    ${head}${obj}${kpiTitle}${tiles}${flowTitle}${flow}${devBox}${actTitle}${acts}${foot}
  </svg>`;
}

/** Genera la infografía horizontal (1920×1080). */
function horizontal(plan) {
  const W = 1920, H = 1080, pad = 64;
  const kpis = plan.kpis.slice(0, 6);
  const critica = plan.desviaciones.filter((d) => ['Alta', 'Crítica'].includes(d.severidad));
  const acciones = plan.planAccion.slice(0, 4);
  const leftW = 620;
  const head = `
    <rect width="${leftW}" height="${H}" fill="url(#ighead)"/>
    ${logo(pad, 58, 64)}
    <text x="${pad + 82}" y="90" font-size="28" font-weight="800" fill="#fff">FRIOPACKING</text>
    <text x="${pad + 82}" y="118" font-size="14" fill="#9EC5E8" letter-spacing="2">PLAN ESTRATÉGICO · 90 DÍAS</text>
    <text x="${pad}" y="210" font-size="18" fill="${C.cyan}" font-weight="700">PLAN ${esc(plan.numero)}</text>
    ${tspans(plan.nombre, pad, 256, 24, 48, `font-size="42" font-weight="800" fill="#fff"`)}
    <text x="${pad}" y="392" font-size="16" font-weight="700" fill="${C.cyan}">OBJETIVO 90 DÍAS</text>
    ${tspans(plan.objetivo90, pad, 424, 46, 27, `font-size="19" fill="#EAF7FF"`)}
    <g transform="translate(${pad},640)">
      <rect width="${leftW - pad * 2}" height="70" rx="14" fill="rgba(255,255,255,0.12)"/>
      <text x="22" y="30" font-size="14" fill="#9EC5E8">AVANCE</text><text x="22" y="56" font-size="26" font-weight="800" fill="#fff">${plan.avance}%</text>
      <text x="180" y="30" font-size="14" fill="#9EC5E8">HITOS</text><text x="180" y="56" font-size="26" font-weight="800" fill="#fff">${plan.hitosCumplidos}/${plan.hitosTotal}</text>
      <text x="340" y="30" font-size="14" fill="#9EC5E8">RIESGO</text><text x="340" y="56" font-size="20" font-weight="800" fill="#fff">${esc(plan.nivelRiesgo)}</text>
    </g>
    <text x="${pad}" y="800" font-size="15" font-weight="700" fill="${C.cyan}">FLUJO OPERATIVO</text>
    ${tspans(plan.flujo.map((n) => n.nombre).join(' → '), pad, 830, 48, 26, `font-size="16" fill="#EAF7FF"`)}
    <text x="${pad}" y="${H - 42}" font-size="13" fill="#7fa8cf">Actualizado ${esc(plan.fechaActualizacion)} · Benchmark: ${esc(plan.benchmark.practicas)}</text>`;

  const rx = leftW + 56;
  const kpiTitle = `<text x="${rx}" y="120" font-size="18" font-weight="800" fill="${C.blue}">INDICADORES PRINCIPALES</text>`;
  const colW = (W - rx - pad - 40) / 3, tileH = 118;
  const tiles = kpis.map((k, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    return metricTile(rx + col * (colW + 20), 140 + row * (tileH + 18), colW, tileH, k);
  }).join('');
  const yAfter = 140 + 2 * (tileH + 18) + 20;
  const devBox = `
    <g transform="translate(${rx},${yAfter})">
      <rect width="${colW}" height="96" rx="14" fill="${critica.length ? '#FBE9E9' : '#E6F6EF'}"/>
      <text x="22" y="44" font-size="14" fill="${C.ink}">Desviaciones críticas</text>
      <text x="22" y="82" font-size="42" font-weight="800" fill="${critica.length ? C.danger : C.ok}">${critica.length}</text>
    </g>
    <g transform="translate(${rx + colW + 20},${yAfter})">
      <rect width="${colW * 2 + 20}" height="96" rx="14" fill="${C.soft}" stroke="${C.line}"/>
      <text x="22" y="34" font-size="14" font-weight="700" fill="${C.blue}">PRÓXIMO HITO</text>
      ${tspans(plan.proximoHito, 22, 62, 62, 24, `font-size="17" font-weight="600" fill="${C.ink}"`)}
    </g>`;
  const actY = yAfter + 118;
  const actTitle = `<text x="${rx}" y="${actY}" font-size="18" font-weight="800" fill="${C.blue}">ACCIONES PRIORITARIAS</text>`;
  const acts = acciones.map((a, i) => {
    const ay = actY + 18 + i * 52;
    return `<g transform="translate(${rx},${ay})">
      <rect width="${W - rx - pad}" height="42" rx="10" fill="#fff" stroke="${C.line}"/>
      <rect width="5" height="42" rx="2.5" fill="${C.blue}"/>
      <text x="20" y="27" font-size="15" font-weight="700" fill="${C.ink}">${esc(a.iniciativa)}</text>
      <text x="${W - rx - pad - 16}" y="27" text-anchor="end" font-size="13" fill="${C.muted}">${esc(a.responsable)} · ${a.progreso}%</text>
    </g>`;
  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Inter, Arial, sans-serif">
    ${defs()}<rect width="${W}" height="${H}" fill="${C.white}"/>
    ${head}${kpiTitle}${tiles}${devBox}${actTitle}${acts}
  </svg>`;
}

function buildInfographic(plan, format = 'vertical') {
  return format === 'horizontal' ? horizontal(plan) : vertical(plan);
}

  horizontal: { width: 1920, height: 1080 },
};

const semClass = (k) => ({ ok: 'ok', warn: 'warn', danger: 'danger', info: 'info', neutral: 'neutral' }[k] || 'neutral');
const estadoClass = (e) => ({ 'Completado': 'ok', 'En ejecución': 'info', 'Abierta': 'danger', 'En control': 'warn', 'En riesgo': 'warn', 'Bloqueado': 'danger' }[e] || 'neutral');

function coverBlock(plan, titulo) {
  const now = new Date().toLocaleString('es-PE');
  return `<div class="cover">
    <div class="kicker">FRIOPACKING · PLAN ESTRATÉGICO 90 DÍAS</div>
    <h1>${esc(titulo || plan.nombre)}</h1>
    <div class="sub">${esc(plan.tagline || '')} · Benchmark: ${esc(plan.benchmark?.practicas || '')}</div>
    <div class="meta">
      <div><b>${plan.avance}%</b><span>Avance</span></div>
      <div><b>${plan.hitosCumplidos}/${plan.hitosTotal}</b><span>Hitos</span></div>
      <div><b>${plan.desviaciones.length}</b><span>Desviaciones</span></div>
      <div><b>${esc(plan.nivelRiesgo)}</b><span>Riesgo</span></div>
      <div><b>${esc(plan.estado)}</b><span>Estado</span></div>
    </div>
    <div class="sub" style="margin-top:18px">Generado: ${esc(now)} · Responsable: ${esc(currentRole().nombre)}</div>
  </div>`;
}

  return `<table><thead><tr><th>KPI</th><th>Unidad</th><th class="right">Base</th><th class="right">Meta</th><th class="right">Actual</th><th>Semáforo</th><th>Responsable</th></tr></thead><tbody>
    ${plan.kpis.map((k) => `<tr>
      <td>${esc(k.kpi)}${k.ejemplo ? ' <span class="ex">EJ</span>' : ''}</td>
      <td>${esc(k.unidad)}</td><td class="right">${num(k.lineaBase)}</td><td class="right">${num(k.meta)}</td>
      <td class="right"><b>${num(k.actual)}</b></td>
      <td><span class="pill ${semClass(k.semaforo)}">${esc(k.semaforo)}</span></td>
      <td>${esc(k.responsable)}</td></tr>`).join('')}
  </tbody></table>`;
}

function qualTable(plan) {
  return `<table><thead><tr><th>Dimensión</th><th>Nivel</th><th>Comentario</th><th>Recomendación</th></tr></thead><tbody>
    ${plan.cualitativo.map((q) => `<tr><td>${esc(q.dimension)}</td><td>${q.calificacion}/5 · ${esc(escalaLabel(q.calificacion))}</td><td>${esc(q.comentario)}</td><td>${esc(q.recomendacion)}</td></tr>`).join('')}
  </tbody></table>`;
}

function devTable(plan) {
  return `<table><thead><tr><th>Código</th><th>Descripción</th><th>Meta</th><th>Resultado</th><th>Sev.</th><th>Causa raíz</th><th>Acción correctiva</th></tr></thead><tbody>
    ${plan.desviaciones.map((d) => `<tr>

  </tbody></table>`;
}

function actTable(plan) {
  return `<table><thead><tr><th>Código</th><th>Iniciativa</th><th>Responsable</th><th>Prioridad</th><th>Estado</th><th class="right">Prog.</th><th>Compromiso</th></tr></thead><tbody>
    ${plan.planAccion.map((a) => `<tr>

/** Reporte breve de 1 página. */
function briefReport(plan) {
  const critica = plan.desviaciones.filter((d) => ['Alta', 'Crítica'].includes(d.severidad));
  return `${coverBlock(plan, plan.nombre + ' — Resumen 1 página')}
    <div class="grid2">
      <div class="box"><h3>Objetivo 90 días</h3><p>${esc(plan.objetivo90)}</p>
        <h3>Próximo hito</h3><p>${esc(plan.proximoHito)}</p></div>
      <div class="box"><h3>Indicadores clave</h3>
        <table><tbody>${plan.kpis.slice(0, 5).map((k) => `<tr><td>${esc(k.kpi)}</td><td class="right"><b>${num(k.actual)} ${esc(k.unidad)}</b></td><td class="right muted">meta ${num(k.meta)}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    <h2>Desviaciones críticas (${critica.length})</h2>
    ${critica.length ? `<ul>${critica.map((d) => `<li><b>${esc(d.codigo)}</b>: ${esc(d.descripcion)} — ${esc(d.control.correctiva)}</li>`).join('')}</ul>` : '<p class="muted">Sin desviaciones críticas.</p>'}
    <h2>Acciones prioritarias</h2>
    <ul>${plan.planAccion.slice(0, 4).map((a) => `<li><b>${esc(a.iniciativa)}</b> — ${esc(a.responsable)} · ${esc(a.estado)} (${a.progreso}%)</li>`).join('')}</ul>
    <div class="foot">Friopacking S.A.C. · Resumen ejecutivo · ${esc(new Date().toLocaleDateString('es-PE'))}</div>`;

/** Reporte consolidado de los 3 planes. */
function consolidatedReport(plans) {
  const now = new Date().toLocaleString('es-PE');
  const avg = Math.round(plans.reduce((a, p) => a + p.avance, 0) / plans.length);
  return `<div class="cover">
      <div class="kicker">FRIOPACKING · TABLERO ESTRATÉGICO</div>
      <h1>Reporte Consolidado — 3 Planes Estratégicos</h1>
      <div class="sub">Período 90 días · Generado ${esc(now)} · Responsable: ${esc(currentRole().nombre)}</div>
      <div class="meta"><div><b>${avg}%</b><span>Avance global</span></div>
        <div><b>${plans.length}</b><span>Planes</span></div>
        <div><b>${plans.reduce((a, p) => a + p.desviaciones.length, 0)}</b><span>Desviaciones</span></div>
        <div><b>${plans.reduce((a, p) => a + p.hitosCumplidos, 0)}/${plans.reduce((a, p) => a + p.hitosTotal, 0)}</b><span>Hitos</span></div>
      </div>
    </div>
    <h2>Panorama por plan</h2>
    <table><thead><tr><th>Plan</th><th>Objetivo</th><th class="right">Avance</th><th>Estado</th><th>Riesgo</th><th class="right">Desv.</th></tr></thead><tbody>
      ${plans.map((p) => `<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.objetivo90)}</td><td class="right">${p.avance}%</td>
        <td><span class="pill ${estadoClass(p.estado)}">${esc(p.estado)}</span></td><td>${esc(p.nivelRiesgo)}</td><td class="right">${p.desviaciones.length}</td></tr>`).join('')}
    </tbody></table>
    ${plans.map((p, i) => `<h2>${i + 1}. ${esc(p.nombre)}</h2>${kpiTable(p)}
      <h3>Desviaciones y acciones</h3>${devTable(p)}`).join('')}
    <div class="foot">Friopacking S.A.C. · Reporte consolidado · Fuente: Plan Estratégico 90 días + importaciones_master.xlsx</div>`;
}

/** API pública. tipo: 'completo' | 'breve' | 'consolidado' */
function buildReport(planOrPlans, tipo = 'completo') {
  let html;
  if (tipo === 'consolidado') html = `<div class="page">${consolidatedReport(planOrPlans)}</div>`;
  else if (tipo === 'breve') html = `<div class="page">${briefReport(planOrPlans)}</div>`;
  else html = `<div class="page">${fullPlanReport(planOrPlans)}</div>`;
  return { html, styles: REPORT_STYLES };
}

/* ------------------------------- INFOGRAFÍA ------------------------------- */
function openInfographic(plan) {
  let format = 'vertical';

    <p class="muted" style="margin-top:10px;font-size:.78rem">Resume únicamente <b>${esc(plan.nombre)}</b>. Alta resolución (${INFOGRAPHIC_SIZE.vertical.width}×${INFOGRAPHIC_SIZE.vertical.height}) apta para móvil y presentaciones.</p>`;
  const footer = `
    <button class="btn" data-act="svg">${icon('download', 15)} SVG</button>
    <button class="btn" data-act="print">${icon('print', 15)} Imprimir / PDF</button>
    <button class="btn" data-act="share">${icon('share', 15)} Compartir</button>

  const dlg = openDialog({ title: `Infografía · ${plan.nombre}`, body, footer, wide: true });
  const root = dlg.el;
  const frame = () => root.querySelector('[data-ig-frame]');
  const currentSvg = () => frame().querySelector('svg');

  root.querySelectorAll('[data-fmt]').forEach((btn) => btn.addEventListener('click', () => {
    root.querySelectorAll('[data-fmt]').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    format = btn.dataset.fmt;
    frame().innerHTML = buildInfographic(plan, format);
  }));

  const getPng = async () => {
    const size = INFOGRAPHIC_SIZE[format];
    return svgToPng(currentSvg(), { width: size.width, height: size.height, scale: format === 'vertical' ? 1.4 : 1.2 });
  };

  root.querySelector('[data-act="png"]').addEventListener('click', async () => {
    try { toast('Generando PNG…'); const url = await getPng();
      downloadDataUrl(url, `infografia-${slug(plan.nombreCorto)}-${format}.png`); toast('PNG descargado', 'ok'); }
    catch (e) { toast('No se pudo generar el PNG', 'danger'); }
  });
  root.querySelector('[data-act="svg"]').addEventListener('click', () => {
    downloadSvg(buildInfographic(plan, format), `infografia-${slug(plan.nombreCorto)}-${format}.svg`); toast('SVG descargado', 'ok');
  });
  root.querySelector('[data-act="print"]').addEventListener('click', () => {
    const size = INFOGRAPHIC_SIZE[format];
    printHtml(`<div style="text-align:center">${buildInfographic(plan, format)}</div>`,
      `Infografía ${plan.nombre}`,
      `@page{size:${format === 'vertical' ? 'portrait' : 'landscape'};margin:0} body{margin:0} svg{width:100%;height:auto}`);
  });
  root.querySelector('[data-act="share"]').addEventListener('click', async () => {
    try {
      const url = await getPng();
      const blob = await (await fetch(url)).blob();
      const file = new File([blob], `infografia-${slug(plan.nombreCorto)}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: plan.nombre, text: `Infografía ${plan.nombre} — Friopacking` });
        toast('Compartido', 'ok');
      } else {
        const shared = await tryWebShare({ title: plan.nombre, text: `Infografía ${plan.nombre} — Friopacking`, url: planLink(plan) });
        if (!shared) { downloadDataUrl(url, `infografia-${slug(plan.nombreCorto)}.png`); toast('Descargado (compartir no disponible)', 'ok'); }
      }
    } catch (e) { toast('No se pudo compartir', 'danger'); }
  });
}

    <button class="btn" data-wa="share">${icon('share', 15)} Compartir</button>
    <button class="btn btn--wa" data-wa="link">${icon('whatsapp', 16)} Abrir WhatsApp</button>`;
  const dlg = openDialog({ title: `Enviar por WhatsApp · ${plan.nombre}`, body, footer });
  const root = dlg.el;
  const getMsg = () => root.querySelector('#wa-msg').value;
  const getPhone = () => {
    const raw = root.querySelector('#wa-phone').value.trim();
    if (!raw) return '';
    return normalizePhone(raw, root.querySelector('#wa-country').value);
  };
  const validate = () => {
    const raw = root.querySelector('#wa-phone').value.trim();
    const err = root.querySelector('[data-err]');
    if (raw && !/^\d{6,15}$/.test(raw.replace(/\D/g, ''))) { err.hidden = false; return false; }
    err.hidden = true; return true;
  };

  root.querySelector('[data-wa="link"]').addEventListener('click', () => {
    if (!validate()) return;
    window.open(waLink(getMsg(), getPhone()), '_blank', 'noopener');
    toast('Abriendo WhatsApp…', 'ok');
  });
  root.querySelector('[data-wa="share"]').addEventListener('click', async () => {
    const shared = await tryWebShare({ title: `Reporte ${plan.nombre}`, text: getMsg(), url: link });

    else { window.open(waLink(getMsg(), getPhone()), '_blank', 'noopener'); toast('Compartir nativo no disponible; abriendo wa.me', ''); }
  });
  root.querySelector('[data-wa="backend"]').addEventListener('click', async (e) => {
    if (!validate()) return;
    const phone = getPhone();
    if (!phone) { toast('Ingresa un número para el envío por API', 'danger'); return; }
    const btn = e.currentTarget; btn.disabled = true;
    try {
      await sendViaBackend(phone, getMsg());
      toast('Mensaje enviado por WhatsApp Business API', 'ok'); dlg.close();
    } catch (err) {
      toast('API no configurada — usa “Abrir WhatsApp” (wa.me)', 'danger');
    } finally { btn.disabled = false; }
  });
}

/* --------------------------- B. Fases y cronograma --------------------------- */
function tabFases(p) {
  const phases = p.fases.map((f) => `<div class="phase ${f.estado}">
    <div class="phase__no">${esc(f.no)} · ${f.estado === 'done' ? 'Completada' : f.estado === 'active' ? 'En curso' : 'Pendiente'}</div>
    <div class="phase__name">${esc(f.nombre)}</div>
    <div class="phase__weeks">Semanas ${esc(f.semanas)}</div>
    <div class="phase__acts">${f.actividades.map((a) => `<div class="phase__act">${icon('chevronRight', 13)}<span>${esc(a)}</span></div>`).join('')}</div>
  </div>`).join('');

  // Gantt simplificado 12 semanas.
  const weekStart = new Date('2026-05-19');
  const dayToWeek = (iso) => {
    if (!iso) return 0;
    const d = new Date(iso + 'T00:00:00');
    return Math.max(0, Math.min(12, (d - weekStart) / (7 * 864e5)));
  };
  const gRows = p.cronograma.map((c) => {
    const start = dayToWeek(c.fechaPlan) - 1.4;
    const s = Math.max(0, start);
    const w = Math.max(1.2, (c.fechaReal ? dayToWeek(c.fechaReal) : dayToWeek(c.fechaPlan)) - s);
    const kind = c.estado === 'Completado' ? 'done' : c.diasDesv > 0 ? 'warn' : '';
    return `<div class="gantt__row">
      <div class="gantt__label" title="${esc(c.actividad)}">${esc(c.actividad)}</div>
      <div class="gantt__track">
        <div class="gantt__bar ${kind}" style="left:${(s / 12 * 100).toFixed(1)}%;width:${(w / 12 * 100).toFixed(1)}%">${c.avance}%</div>
      </div>
    </div>`;
  }).join('');

  const cronTable = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Actividad</th><th>Responsable</th><th>Entregable</th><th>Dependencias</th><th>Estado</th><th>Avance</th><th>Fecha plan</th><th>Fecha real</th><th>Desv. (días)</th></tr></thead>
    <tbody>${p.cronograma.map((c) => `<tr>
      <td class="strong">${esc(c.actividad)}</td><td>${esc(c.responsable)}</td><td>${esc(c.entregable)}</td><td class="muted">${esc(c.dependencias)}</td>
      <td>${statusBadge(c.estado)}</td><td style="min-width:90px">${progressBar(c.avance)}</td>
      <td>${fecha(c.fechaPlan)}</td><td>${c.fechaReal ? fecha(c.fechaReal) : '<span class="faint">—</span>'}</td>
      <td class="num"><b style="color:${c.diasDesv > 0 ? 'var(--danger)' : c.diasDesv < 0 ? 'var(--ok)' : 'var(--text-muted)'}">${c.diasDesv > 0 ? '+' : ''}${c.diasDesv}</b></td>
    </tr>`).join('')}</tbody></table></div>`;

  return `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel__head"><h3>Fases del plan (90 días)</h3><span class="panel__sub">Diagnóstico · Implementación · Consolidación</span></div>
      <div class="phase-track">${phases}</div>
    </div>
    <div class="panel" style="margin-bottom:18px">
      <div class="panel__head"><h3>Cronograma (Gantt simplificado)</h3></div>
      <div class="gantt__scale"><span></span><div class="gantt__weeks">${Array.from({ length: 12 }, (_, i) => `<span>S${i + 1}</span>`).join('')}</div></div>
      <div class="gantt">${gRows}</div>
      <div class="pill-legend" style="margin-top:12px"><span><i style="background:var(--brand-600)"></i>En curso</span><span><i style="background:var(--ok)"></i>Completado</span><span><i style="background:var(--warn)"></i>Con desviación</span></div>
    </div>
    <div class="panel">
      <div class="panel__head"><h3>Detalle de actividades</h3></div>
      ${cronTable}
    </div>`;
}

/* ------------------------------- C. Flujo operativo ------------------------------- */

    return `<tr>
      <td class="strong">${esc(k.kpi)}${k.ejemplo ? ' <span class="example-tag" title="Dato de ejemplo / pendiente de validación">ej.</span>' : ''}<div class="muted" style="font-size:.72rem;font-weight:400">${esc(k.definicion)}</div></td>

      <td>${tendencia(k.tendencia)}</td>

    <p class="muted" style="font-size:.74rem;margin-top:10px">Los indicadores marcados con <span class="example-tag">ej.</span> son datos de ejemplo/pendientes de validación. La cobertura y volumen de importaciones provienen de importaciones_master.xlsx.</p>

}

/* ------------------------------ H. Plan de acción ------------------------------ */
const KANBAN_COLS = ['No iniciado', 'En planificación', 'En ejecución', 'En riesgo', 'Bloqueado', 'Completado'];
function actionTable(p) {
  return `<div class="table-wrap"><table class="tbl">

    <tbody>${p.planAccion.map((a) => `<tr>
      <td class="strong">${esc(a.codigo)}</td><td class="strong">${esc(a.iniciativa)}<div class="muted" style="font-size:.72rem;font-weight:400">${esc(a.problema)}</div></td>
      <td style="font-size:.8rem">${esc(a.accion)}</td><td>${esc(a.responsable)}</td><td>${esc(a.area)}</td>
      <td>${badge(a.prioridad, a.prioridad === 'Crítica' ? 'danger' : a.prioridad === 'Alta' ? 'warn' : 'neutral')}</td>
      <td>${badge(a.estado, estadoKind(a.estado))}</td><td style="min-width:80px">${progressBar(a.progreso)}</td>
      <td style="font-size:.78rem">${esc(a.kpiValidacion)}</td><td>${esc(a.meta)}</td><td>${fecha(a.fechaCompromiso)}</td><td>${esc(a.presupuesto)}</td>
      <td class="muted" style="font-size:.78rem">${esc(a.proximoPaso)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function actionKanban(p) {
  return `<div class="kanban">${KANBAN_COLS.map((col) => {
    const items = p.planAccion.filter((a) => a.estado === col);
    return `<div class="kanban__col">
      <div class="kanban__col-head">${esc(col)}<span class="count">${items.length}</span></div>
      ${items.map((a) => `<div class="kanban__card" style="border-left-color:${a.prioridad === 'Crítica' ? 'var(--danger)' : a.prioridad === 'Alta' ? 'var(--warn)' : 'var(--brand-500)'}">

        <div style="margin-top:6px">${progressBar(a.progreso)}</div>
      </div>`).join('') || '<div class="muted" style="font-size:.74rem;padding:8px">—</div>'}
    </div>`;
  }).join('')}</div>`;
}
function actionTimeline(p) {
  const sorted = [...p.planAccion].sort((a, b) => new Date(a.fechaCompromiso) - new Date(b.fechaCompromiso));
  return `<div class="stack">${sorted.map((a) => `<div class="row" style="align-items:stretch;gap:14px">
    <div style="flex:0 0 96px;text-align:right;padding-top:12px"><b style="font-size:.8rem">${fecha(a.fechaCompromiso)}</b></div>
    <div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center"><span style="width:14px;height:14px;border-radius:50%;background:${a.estado === 'Completado' ? 'var(--ok)' : 'var(--brand-500)'};margin-top:12px"></span><span style="flex:1;width:2px;background:var(--border)"></span></div>

      <div class="muted" style="font-size:.78rem;margin-top:3px">${esc(a.responsable)} · ${esc(a.area)} · Impacto: ${esc(a.impacto)}</div>
    </div>
  </div>`).join('')}</div>`;
}
function actionCalendar(p) {
  const byMonth = {};
  p.planAccion.forEach((a) => {
    const key = new Date(a.fechaCompromiso + 'T00:00:00').toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });
    (byMonth[key] = byMonth[key] || []).push(a);
  });
  return `<div class="grid grid-3">${Object.entries(byMonth).map(([mes, items]) => `<div class="panel">
    <div class="panel__head"><h3 style="font-size:.9rem;text-transform:capitalize">${esc(mes)}</h3><span class="badge neutral">${items.length}</span></div>
    <div class="stack">${items.map((a) => `<div style="border-left:3px solid ${a.prioridad === 'Crítica' ? 'var(--danger)' : 'var(--brand-500)'};padding:4px 0 4px 10px">
      <div style="font-size:.82rem;font-weight:600">${esc(a.iniciativa)}</div>

  </div>`).join('')}</div>`;
}
function actionSummary(p) {
  const byEstado = {};
  p.planAccion.forEach((a) => { byEstado[a.estado] = (byEstado[a.estado] || 0) + 1; });
  const prog = Math.round(p.planAccion.reduce((s, a) => s + a.progreso, 0) / p.planAccion.length);
  return `<div class="grid grid-4" style="margin-bottom:14px">
      <div class="stat"><div class="stat__label">Iniciativas</div><div class="stat__value">${p.planAccion.length}</div></div>

      <div class="stat"><div class="stat__label">En ejecución</div><div class="stat__value">${byEstado['En ejecución'] || 0}</div></div>
      <div class="stat warn"><div class="stat__label">Pend. de iniciar</div><div class="stat__value">${byEstado['No iniciado'] || 0}</div></div>
    </div>
    <div class="stack">${p.planAccion.map((a) => `<div class="panel" style="padding:12px 14px">
      <div class="row" style="justify-content:space-between"><b style="font-size:.86rem">${esc(a.iniciativa)}</b>${badge(a.prioridad, a.prioridad === 'Crítica' ? 'danger' : a.prioridad === 'Alta' ? 'warn' : 'neutral')}</div>

    </div>`).join('')}</div>`;
}
const ACTION_VIEWS = {
  tabla: { label: 'Tabla', icon: 'list', render: actionTable },
  kanban: { label: 'Kanban', icon: 'grid', render: actionKanban },
  timeline: { label: 'Timeline', icon: 'activity', render: actionTimeline },

/** Wire de interacciones dentro del contenido del detalle. */
function mountPlanDetail(root, p, onTabChange) {
  const panel = root.querySelector('[data-tabpanel]');

  const wirePanel = () => {
    // Flujo: selección de nodos.
    const detail = panel.querySelector('[data-flow-detail]');
    panel.querySelectorAll('[data-node]').forEach((node) => {
      const sel = () => {
        panel.querySelectorAll('[data-node]').forEach((n) => n.classList.remove('sel'));
        node.classList.add('sel');
        detail.innerHTML = flowNodeDetail(p.flujo[+node.dataset.node]);
      };
      node.addEventListener('click', sel);
      node.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel(); } });
    });
    // Desviaciones: abrir detalle.
    panel.querySelectorAll('[data-dev]').forEach((el) => el.addEventListener('click', () => {
      const d = p.desviaciones.find((x) => x.codigo === el.dataset.dev);
      if (d) openDialog({ title: `Desviación ${d.codigo}`, body: deviationDetail(d), wide: true });
    }));
    // Plan de acción: cambio de vista.
    const aviews = panel.querySelector('[data-action-views]');
    const abody = panel.querySelector('[data-action-body]');
    if (aviews && abody) {
      aviews.querySelectorAll('[data-aview]').forEach((btn) => btn.addEventListener('click', () => {
        aviews.querySelectorAll('[data-aview]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        abody.innerHTML = ACTION_VIEWS[btn.dataset.aview].render(p);
      }));
    }
  };
  wirePanel();

  // Tabs.
  root.querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => {
    const id = btn.dataset.tab;
    root.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b === btn));
    panel.innerHTML = TAB_RENDER[id](p);
    wirePanel();
    onTabChange && onTabChange(id);
  }));
}

  openInfographic(p);
});
route('/plan/:id/reporte', ({ id }) => {
  const p = getPlan(id); if (!p) { navigate('#/planes'); return; }
  paint(renderPlanDetail(p, 'resumen')); mountPlanDetail(content(), p);
  openReport(p, plans);
});
setNotFound(() => paint(`<div class="state-box">${icon('alert', 40)}<h3>Página no encontrada</h3><p><a href="#/">Ir al inicio</a></p></div>`));

/* ---------------------- Delegación de acciones globales ---------------------- */
function wireGlobalActions() {
  const root = document.getElementById('app');
  on(root, 'click', '[data-action]', (e, el) => {
    const action = el.dataset.action;
    const p = el.dataset.plan ? getPlan(el.dataset.plan) : null;
    if (action === 'infographic' && p) openInfographic(p);
    else if (action === 'report' && p) openReport(p, plans);
    else if (action === 'whatsapp' && p) openWhatsApp(p);
    else if (action === 'report-consolidated') {
      const { html, styles } = buildReport(plans, 'consolidado');
      printHtml(html, 'Reporte consolidado Friopacking', styles);
    }
  });
  // Reportes directos desde el centro de reportes.
  on(root, 'click', '[data-report-plan]', (e, el) => {
    const p = getPlan(el.dataset.reportPlan);
    if (!p) return;
    const { html, styles } = buildReport(p, el.dataset.tipo || 'completo');
    printHtml(html, `Reporte ${p.nombre}`, styles);
  });
}

/* -------------------------------- Init -------------------------------- */
function init() {
  shell();
  wireGlobalActions();
  startRouter();
